server:
  port: 8081

spring:
  application:
    name: twitter-clone
  
  datasource:
    url: jdbc:mysql://localhost:3306/twitter_clone?allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=UTC
    username: twitter_user
    password: twitter_pass
    driver-class-name: com.mysql.cj.jdbc.Driver
  
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect
        format_sql: true
  data:
    redis:
      host: localhost
      port: 6379
      timeout: 2000ms
  
  session:
    store-type: redis
    timeout: 30m  # 30 minutos

logging:
  level:
    com.twitter.clone: DEBUG